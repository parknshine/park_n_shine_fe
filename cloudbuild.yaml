# Cloud Build pipeline: build image, push to Artifact Registry, deploy to Cloud Run.
# Triggered on push to `main` (configure trigger in Cloud Build console).
#
# Required substitutions are defaulted below. Override per-trigger in the
# console if you need different values (region, service name, API URL, etc).
#
# IAM the Cloud Build service account needs:
#   - roles/artifactregistry.writer
#   - roles/run.admin
#   - roles/iam.serviceAccountUser  (to act as the Cloud Run runtime SA)
#   - roles/logging.logWriter       (only if you set the `logging` option below)

substitutions:
  _REGION: asia-southeast1
  _REPO: park-n-shine
  _SERVICE: park-n-shine
  _IMAGE: app
  _NEXT_PUBLIC_API_URL: https://api.parknshine.net
  _NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BMbC_2Wanr4SAHo68INnHG1jz4PcPiS--5SOCmAmgQRKMlRo_l1jFX0Zq7pRH1ATeYfMUYGsxViBnjrCStnB7Rw"
  _NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ""
  _NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "true"
  _NEXT_PUBLIC_SENTRY_DSN: ""
  _NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDrT4yW-EfB-faJuG0wNR-I4k1k-8lfhUk"
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: auth.parknshine.net
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: parknshine-9c1c1
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: parknshine-9c1c1.firebasestorage.app
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1072064447888"
  _NEXT_PUBLIC_FIREBASE_APP_ID: "1:1072064447888:web:36640bd3ecb027f3529f15"
  _NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-N386MLY91X
  # TEMPORARY: mirrors backend _MIDTRANS_CHARGE_MODE workaround — see park-n-shine-api/cloudbuild.yaml
  _NEXT_PUBLIC_SKIP_PAYMENT_METHOD_SELECTION: "true"
  # Middleware cookie-JWT gate — keep "false": the 307 it issued on expired
  # crew-token cookies trapped crews in a login redirect loop (stuck spinner).
  # Client-side shells + API auth still protect everything.
  _NEXT_PUBLIC_COOKIE_AUTH: "false"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Build image, tagged with the commit SHA so we can roll back.
  #    NEXT_PUBLIC_* must be passed as build-args — they are inlined into the
  #    JS bundle by `next build` and cannot be overridden at runtime.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${_NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - --build-arg
      - NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${_NEXT_PUBLIC_MIDTRANS_CLIENT_KEY}
      - --build-arg
      - NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION=${_NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION}
      - --build-arg
      - NEXT_PUBLIC_SENTRY_DSN=${_NEXT_PUBLIC_SENTRY_DSN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
      - --build-arg
      - NEXT_PUBLIC_SKIP_PAYMENT_METHOD_SELECTION=${_NEXT_PUBLIC_SKIP_PAYMENT_METHOD_SELECTION}
      - --build-arg
      - NEXT_PUBLIC_COOKIE_AUTH=${_NEXT_PUBLIC_COOKIE_AUTH}
      - .

  # 2. Push both tags to Artifact Registry.
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

  # 3. Deploy the SHA-tagged image to Cloud Run.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=3000
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=10
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL},NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${_NEXT_PUBLIC_MIDTRANS_CLIENT_KEY},NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION=${_NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION},NEXT_PUBLIC_SENTRY_DSN=${_NEXT_PUBLIC_SENTRY_DSN},NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET},NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID},NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID},NEXT_PUBLIC_SKIP_PAYMENT_METHOD_SELECTION=${_NEXT_PUBLIC_SKIP_PAYMENT_METHOD_SELECTION},NEXT_PUBLIC_COOKIE_AUTH=${_NEXT_PUBLIC_COOKIE_AUTH}
      - --set-secrets=CREW_JWT_SECRET=parknshine-crew-jwt-secret:latest,ADMIN_JWT_SECRET=parknshine-admin-jwt-secret:latest

# Surface the image URI in build history.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

timeout: 1800s
