# Park & Shine — Nginx reverse proxy reference config
# For self-hosted deployments only (VM/VPS).
# Not required for Vercel or GCP Cloud Run.
#
# Prerequisites:
#   - Next.js container running on internal network as "nextjs:3000"
#   - SSL termination handled upstream (load balancer or Certbot)
#
# IMPORTANT: proxy_set_header Host $host is required.
# Without it, Next.js middleware cannot detect the subdomain.

upstream nextjs {
    server nextjs:3000;
    keepalive 64;
}

# Customer Web App
server {
    listen 80;
    server_name app.park-shine.sg;

    location / {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

